<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Place</title>
  <link rel="stylesheet" type="text/css" media="all" href="/css/menu.css" th:href="@{/css/menu.css}" />
  <link rel="stylesheet" type="text/css" media="all" href="/css/index.css" th:href="@{/css/index.css}" />
  <link rel="stylesheet" type="text/css" media="all" href="/css/form.css" th:href="@{/css/form.css}" />
</head>
<body>
  <th:block th:include="/menu/menu"></th:block>
  <div class="center-div">
    <div class="form-container">
      <h1 id="title">Create Place</h1>
      <form th:action="@{/createPlaceForm}" th:object="${place}" method="post" id="survey-form">

        <div th:if="${message}" style="color: red;">
          <p th:text="${message}"></p>
        </div>

        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" th:field="*{name}">
        </div>

        <div class="form-group">
          <label for="address">Address:</label>
          <input type="text" id="address" th:field="*{address}">
        </div>

        <div class="form-group">
          <input type="submit" id="submit"  value="Add Place">
        </div>

      </form>
    </div>
  </div>
</body>
</html>
